<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="description" content="Gapped — race the runners around you, head to head." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Gapped</title>
    <script>
      // Apply a saved dark theme before first paint so a reload never flashes light.
      try {
        if (localStorage.getItem('gapped.theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.colorScheme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#121211'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
